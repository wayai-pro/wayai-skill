name: Support Pilot
role: pilot
connection: openai-main
settings:
  model: gpt-5
  max_tokens: 2048
  # temperature omitted — gpt-5 is a reasoning model and strips it (set temperature only on non-reasoning OpenAI models)
  # reasoning_effort: medium   # optional reasoning control (this agent is OpenAI); Anthropic agents use thinking_enabled + effort — see references/agents/roles-and-settings.md#reasoning--thinking-by-provider
additional_context_template: |
  Current time: {{now()}}
  Active ticket: {{state(conversation, ticket_intake)}}
  Customer profile: {{state(user, customer_profile)}}
tools:
  native:
    - get_state
    - update_state
    - set_state_path
    - update_kanban_status
    - close_conversation
    - list_files
    - read_file
  delegation:
    - type: team
      tool: transfer_to_team
      target: Tier 2 Support
resources:
  - name: Company FAQ
    priority: 0
